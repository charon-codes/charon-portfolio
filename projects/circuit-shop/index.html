<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltix — electronics parts store (demo)</title>
<meta name="description" content="Voltix is a demo online store for electronics parts: search, filters, sorting, product details, a persistent cart and a validated checkout. Built with plain JavaScript.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H32z' fill='%23facc15'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#grid">Skip to products</a>
<div class="demo">Demo store · fictional products · no real payments</div>
<header class="bar">
  <a class="logo" href="#" aria-label="Voltix home">Volt<span>ix</span></a>
  <label class="search"><span class="sr">Search products</span><input id="q" type="search" placeholder="Search boards, sensors, tools…" autocomplete="off"></label>
  <button type="button" id="cartBtn" class="cart-btn" aria-label="Open cart, 0 items">🛒 <span id="badge">0</span></button>
</header>
<div class="layout">
  <aside class="filters" aria-label="Filters">
    <fieldset><legend>Category</legend><div id="cats"></div></fieldset>
    <label class="range">Max price: <b id="maxOut">$100</b><input id="max" type="range" min="500" max="10000" step="100" value="10000"></label>
    <label class="chk"><input type="checkbox" id="stock"> In stock only</label>
    <label>Sort by<select id="sort"><option value="featured">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Top rated</option><option value="name">Name</option></select></label>
    <button type="button" id="reset" class="link">Reset filters</button>
  </aside>
  <main>
    <p id="count" class="count" aria-live="polite"></p>
    <ul id="grid" class="grid"></ul>
    <p id="none" class="none" hidden>No products match. Try clearing a filter.</p>
  </main>
</div>
<p class="live sr" id="live" role="status" aria-live="polite"></p>

<dialog id="pd" class="modal" aria-labelledby="pd-t"><div class="modal-in" id="pd-body"></div></dialog>

<dialog id="cd" class="sheet" aria-labelledby="cd-t">
  <div class="sheet-h"><h2 id="cd-t">Your cart</h2><button type="button" class="x" id="cdClose" aria-label="Close cart">×</button></div>
  <div id="cart-view"></div>
  <form id="co" class="co" novalidate hidden>
    <h3>Checkout</h3>
    <div class="f"><label for="c-name">Full name</label><input id="c-name" autocomplete="name"><p class="err" id="e-name"></p></div>
    <div class="f"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="email"><p class="err" id="e-email"></p></div>
    <div class="f"><label for="c-address">Street address</label><input id="c-address" autocomplete="street-address"><p class="err" id="e-address"></p></div>
    <div class="f"><label for="c-zip">Postal code</label><input id="c-zip" autocomplete="postal-code" inputmode="numeric"><p class="err" id="e-zip"></p></div>
    <p class="fine">Demo only. No payment details are collected and nothing is sent anywhere.</p>
    <div class="row"><button type="button" class="ghost" id="back">Back to cart</button><button type="submit" class="primary" id="place">Place demo order</button></div>
  </form>
  <div id="ok" class="ok" hidden></div>
</dialog>
<footer>Demo project by Charon — <a href="../../">← back to portfolio</a> · <a href="https://github.com/charon-codes/charon-portfolio/tree/main/projects/circuit-shop">source</a></footer>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
